<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Library Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: goldenrod;
      font-family: 'Segoe UI', sans-serif;
    }
    header, footer {
      background-color: #13181d;
      color: gold;
      text-align: center;
      padding: 20px;
    }
    .login-box {
      max-width: 400px;
      margin: 50px auto;
      background: rgb(207, 191, 168);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(228, 200, 200, 0.1);
    }
  </style>
</head>
<body>

  <header>
    <h1>Library Management System</h1>
    <p>Please log in to continue</p>
  </header>

  <main class="login-box">
    <h2 class="text-center mb-4">Login</h2>
    <form>
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Login</button>
    </form>
    <p class="text-center mt-3">Don't have an account? <a href="register.html">Register here</a></p>
  </main>

  <footer>
    <p>&copy; 2025 Library Management System | Frantz Fanon University</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
